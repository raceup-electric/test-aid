[package]
name = "taid"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A terminal UI for driverless repositories, submodule commits and module configurations"
license = "MIT"
readme = "README.md"
keywords = ["git", "submodules", "tui", "terminal"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
# TUI stack
ratatui = "0.29"
# 0.28 to match the version ratatui 0.29 uses (avoids two crossterm copies)
crossterm = "0.28"

# Git operations via vendored libgit2: statically linked into the binary,
# without ssh/https features. Explicit remote operations use system Git so
# existing SSH aliases and credential helpers work without extra setup.
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
unicode-segmentation = "1"
unicode-width = "0.2"
yaml-rust2 = { version = "0.11", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Integration tests drive the real binary in a pseudo-terminal
portable-pty = "0.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
