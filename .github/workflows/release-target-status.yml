name: Check release target

on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check target job in latest release build
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ inputs.target }}
        run: sh .github/scripts/check-release-target.sh
